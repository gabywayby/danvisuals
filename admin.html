<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Studio bookings | Dan Visuals</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js" defer></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="admin-header">
    <a class="admin-brand" href="index.html">Dan Visuals <span>Studio</span></a>
    <button class="button button-quiet hidden" id="signOutButton" type="button">Sign out</button>
  </header>
  <main class="admin-main">
    <section class="login-panel" id="loginPanel">
      <p class="eyebrow">Private studio</p>
      <h1>Booking dashboard</h1>
      <form id="loginForm" class="login-form">
        <label>Email<input name="email" type="email" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button" type="submit">Sign in</button>
      </form>
      <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
    </section>

    <section class="dashboard hidden" id="dashboard">
      <div class="dashboard-heading"><div><p class="eyebrow">Private studio</p><h1>Booking dashboard</h1></div><p id="dashboardMessage" class="message" role="status" aria-live="polite"></p></div>
      <div class="stats-grid" aria-label="Booking totals">
        <article class="stat-card"><span>New</span><strong id="statNew">0</strong></article>
        <article class="stat-card"><span>Confirmed</span><strong id="statConfirmed">0</strong></article>
        <article class="stat-card"><span>Upcoming</span><strong id="statUpcoming">0</strong></article>
        <article class="stat-card"><span>Total</span><strong id="statTotal">0</strong></article>
      </div>
      <div class="tab-bar" role="tablist" aria-label="Dashboard views">
        <button class="tab-button is-active" id="bookingsTab" type="button" role="tab" aria-selected="true">Bookings</button>
        <button class="tab-button" id="calendarTab" type="button" role="tab" aria-selected="false">Calendar</button>
      </div>
      <section id="bookingsView" class="view-panel" role="tabpanel" aria-labelledby="bookingsTab">
        <div class="table-wrap"><table><thead><tr><th>Event date</th><th>Client</th><th>Package</th><th>Price</th><th>Deposit</th><th>Balance due</th><th>Event</th><th>Contact</th><th>Notes</th><th>Status</th><th>Action</th></tr></thead><tbody id="bookingsBody"></tbody></table></div>
        <p id="emptyBookings" class="empty-state hidden">No bookings yet.</p>
      </section>
      <section id="calendarView" class="view-panel hidden" role="tabpanel" aria-labelledby="calendarTab">
        <div class="calendar-toolbar"><button class="button button-quiet" id="previousMonth" type="button" aria-label="Previous month">‹</button><h2 id="calendarTitle"></h2><button class="button button-quiet" id="nextMonth" type="button" aria-label="Next month">›</button></div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div class="calendar-legend"><span class="legend-new">New</span><span class="legend-confirmed">Confirmed</span><span class="legend-completed">Completed</span><span class="legend-cancelled">Cancelled</span></div>
      </section>
    </section>
  </main>
</body>
</html>
